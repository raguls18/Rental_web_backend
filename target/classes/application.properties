# ============================================================
# SERVER
# ============================================================
server.port=8080

# ============================================================
# DATASOURCE — MySQL 8.x
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/renthouse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# JWT
# ============================================================
# Use a long, random, Base64-safe string (min 256-bit / 32 chars)
jwt.secret=RentHouse2024SecretKeyForJWTTokenGenerationAndValidation123456
jwt.expiration=86400000

